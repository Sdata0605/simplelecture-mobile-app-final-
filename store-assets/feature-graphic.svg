<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2BBD6E"/>
      <stop offset="100%" stop-color="#1a9455"/>
    </linearGradient>
    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <!-- Accent gradient -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Decorative circles (background depth) -->
  <circle cx="900" cy="-20" r="220" fill="#ffffff" opacity="0.05"/>
  <circle cx="960" cy="400" r="140" fill="#ffffff" opacity="0.04"/>
  <circle cx="-40" cy="480" r="180" fill="#ffffff" opacity="0.04"/>

  <!-- Left content block -->
  <!-- Logo circle -->
  <circle cx="72" cy="72" r="36" fill="#ffffff" opacity="0.15"/>
  <text x="72" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#ffffff">SL</text>

  <!-- App name -->
  <text x="120" y="58" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="0.5">Simple Lecture</text>
  <text x="120" y="82" font-family="Arial, sans-serif" font-size="13" fill="#d1fae5" letter-spacing="1">ONLINE LEARNING APP</text>

  <!-- Divider line -->
  <rect x="40" y="116" width="400" height="2" rx="1" fill="#4ADE80" opacity="0.5"/>

  <!-- Main headline -->
  <text x="40" y="180" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">Learn Smarter</text>
  <text x="40" y="235" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">with <tspan fill="#4ADE80">AI</tspan> Lectures</text>

  <!-- Subheadline -->
  <text x="40" y="285" font-family="Arial, sans-serif" font-size="18" fill="#d1fae5">JEE · NEET · CBSE · 13 Indian Languages</text>

  <!-- Feature pills -->
  <!-- Pill 1 -->
  <rect x="40" y="320" width="152" height="36" rx="18" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="116" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">🤖 AI Tutor</text>

  <!-- Pill 2 -->
  <rect x="204" y="320" width="172" height="36" rx="18" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="290" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">💬 Doubt Solving</text>

  <!-- Pill 3 -->
  <rect x="40" y="368" width="162" height="36" rx="18" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="121" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">🏅 Badges &amp; Certs</text>

  <!-- Pill 4 -->
  <rect x="214" y="368" width="162" height="36" rx="18" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="295" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">📊 Progress Track</text>

  <!-- Right side — phone mockup -->
  <g filter="url(#shadow)">
    <!-- Phone body -->
    <rect x="560" y="30" width="240" height="440" rx="32" fill="#1a1a2e"/>
    <!-- Phone notch -->
    <rect x="655" y="30" width="50" height="10" rx="5" fill="#111"/>
    <!-- Screen area -->
    <rect x="570" y="48" width="220" height="412" rx="20" fill="#0f1b2d"/>

    <!-- Screen content — mini app UI -->
    <!-- Header bar green -->
    <rect x="570" y="48" width="220" height="52" rx="20" fill="#2BBD6E"/>
    <rect x="570" y="78" width="220" height="22" fill="#2BBD6E"/>
    <text x="680" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">AI Lecture Player</text>

    <!-- Avatar placeholder -->
    <rect x="620" y="108" width="120" height="80" rx="10" fill="#1e3a5f"/>
    <circle cx="680" cy="148" r="25" fill="#2BBD6E" opacity="0.8"/>
    <text x="680" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#fff">▶</text>

    <!-- Slide content lines -->
    <rect x="578" y="200" width="180" height="8" rx="4" fill="#2BBD6E" opacity="0.6"/>
    <rect x="578" y="216" width="150" height="6" rx="3" fill="#ffffff" opacity="0.15"/>
    <rect x="578" y="230" width="160" height="6" rx="3" fill="#ffffff" opacity="0.12"/>
    <rect x="578" y="244" width="130" height="6" rx="3" fill="#ffffff" opacity="0.1"/>

    <!-- Progress bar -->
    <rect x="578" y="268" width="200" height="4" rx="2" fill="#ffffff" opacity="0.1"/>
    <rect x="578" y="268" width="130" height="4" rx="2" fill="#2BBD6E"/>

    <!-- Badge row -->
    <rect x="578" y="290" width="200" height="54" rx="10" fill="url(#cardGrad)" stroke="#2BBD6E" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="600" cy="317" r="14" fill="#fbbf24"/>
    <text x="600" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">🥇</text>
    <text x="620" y="312" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#4ADE80">BADGE EARNED!</text>
    <text x="620" y="326" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8">Topic Completed — Bronze</text>

    <!-- Bottom nav bar -->
    <rect x="570" y="415" width="220" height="45" rx="0" fill="#0f1b2d"/>
    <rect x="570" y="456" width="220" height="4" rx="20" fill="#0f1b2d"/>
    <!-- Nav icons -->
    <text x="600" y="442" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">📚</text>
    <text x="635" y="442" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">📊</text>
    <circle cx="680" cy="434" r="16" fill="#2BBD6E"/>
    <text x="680" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">🏠</text>
    <text x="725" y="442" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">💬</text>
    <text x="760" y="442" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">👤</text>
  </g>

  <!-- Star rating (bottom right) -->
  <rect x="820" y="380" width="164" height="76" rx="14" fill="#ffffff" opacity="0.12"/>
  <text x="902" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">★ ★ ★ ★ ★</text>
  <text x="902" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#d1fae5">Trusted by students across India</text>
  <text x="902" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5">Available on Google Play</text>
</svg>
